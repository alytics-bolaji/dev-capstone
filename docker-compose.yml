services:
 
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/frontend:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
 
  api:
    build: ./api
    environment:
      DB_HOST:     postgres
      DB_NAME:     appdb
      DB_USER:     appuser
      DB_PASSWORD: secret123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
 
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       appdb
      POSTGRES_USER:     appuser
      POSTGRES_PASSWORD: secret123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD","pg_isready","-U","appuser","-d","appdb"]
      interval: 10s

      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
 
volumes:
  pgdata:

